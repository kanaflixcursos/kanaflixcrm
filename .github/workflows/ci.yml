name: Kanaflix CRM CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kanaflix-crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kanaflix-crm/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
